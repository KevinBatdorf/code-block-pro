name: Playwright Tests
permissions:
  contents: write
on:
  pull_request:
  push:

jobs:
  discover:
    # A branch in this repo already ran on push.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    name: Discover test suites
    runs-on: ubuntu-latest
    outputs:
      suites: ${{ steps.find.outputs.suites }}
      image: ${{ steps.image.outputs.image }}
    steps:
    - uses: actions/checkout@v6
    - id: find
      run: |
        suites=$(find tests -name '*.spec.ts' | while read spec; do
          dir=$(dirname "$spec")
          if [ -f "$dir/blueprint.json" ]; then
            basename "$spec" .spec.ts
          fi
        done | jq -R -s -c 'split("\n") | map(select(length > 0))')
        echo "suites=$suites" >> "$GITHUB_OUTPUT"
    # container.image can't read env, so the tag travels as a job output.
    - id: image
      run: echo "image=mcr.microsoft.com/playwright:v$(node -p "require('./package.json').devDependencies['@playwright/test']")-noble" >> "$GITHUB_OUTPUT"

  test:
    name: ${{ matrix.suite }}
    needs: discover
    concurrency:
      group: ${{ github.workflow }} - ${{ matrix.suite }} - ${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    # The legacy-blocks screenshots were captured in this image on arm64.
    runs-on: ubuntu-24.04-arm
    container:
      image: ${{ needs.discover.outputs.image }}
      options: --init --ipc=host
    env:
      PW_IMAGE: ${{ needs.discover.outputs.image }}
      WP_VERSION: 7.1.3
      PLAYWRIGHT_HTML_OPEN: never
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJson(needs.discover.outputs.suites) }}

    steps:
    - uses: actions/checkout@v6

    - uses: actions/cache@v4
      with:
        path: |
          ~/.npm
          ~/.wordpress-playground
        key: e2e-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}-wp-7.1.3

    - run: npm ci --prefer-offline --no-audit --no-fund

    - name: Build project
      run: npm run build
      env:
        CI: true

    - name: Run Playwright tests
      run: RUN_PROJECT="${{ matrix.suite }}" npx playwright test --project="${{ matrix.suite }}"

    - name: Set artifact name
      if: ${{ !cancelled() }}
      id: artifact
      run: echo "name=pw-${{ matrix.suite }}" >> "$GITHUB_OUTPUT"

    - uses: actions/upload-artifact@v6
      if: ${{ !cancelled() }}
      with:
        name: ${{ steps.artifact.outputs.name }}
        path: playwright-report/
        retention-days: 30
