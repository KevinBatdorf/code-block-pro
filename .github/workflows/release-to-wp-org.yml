name: Deploy to WordPress.org
on:
    release:
        types: [published]
jobs:
    tag:
        name: Make release
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - uses: actions/setup-node@v6
              with:
                  node-version: lts/*
                  cache: 'npm'

            - name: npm install and build
              run: |
                  npm ci
                  npm run lint
                  npm run build
                  cmp src/legacy/assets/front.js build/front/front.js
                  cmp src/legacy/assets/style-index.css build/style-index.css
              env:
                  CI: true

            - name: WordPress Plugin Deploy
              id: deploy
              uses: 10up/action-wordpress-plugin-deploy@stable
              with:
                  generate-zip: true
              env:
                  SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
                  SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
                  SLUG: code-block-pro
